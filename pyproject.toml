[project]
name = "changelog-gen"
version = "0.1.0"
description = "AI-powered changelog & release notes generator: Git commits + merged PRs -> polished release notes."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Srikanth Pusapati" }]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "requests>=2.32",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
changelog-gen = "changelog_gen.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/changelog_gen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# `typer.Option(...)` in a default argument is the framework's own idiom —
# it's how Typer discovers flag metadata. B008 does not apply here.
"src/changelog_gen/cli.py" = ["B008"]
